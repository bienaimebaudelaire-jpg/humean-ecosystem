[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humean-ecosystem"
version = "0.1.0"
description = "Governed AI orchestration and capability evaluation infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Only needed to run scripts/capability_probe.py --live. humean-core itself
# stays dependency-free on purpose (see README: "Generic infrastructure first").
providers = [
    "anthropic>=0.40",
    "google-generativeai>=0.8",
    "openai>=1.50",
]

[tool.pytest.ini_options]
testpaths = ["packages/humean-core/tests"]

[tool.setuptools.packages.find]
where = ["packages/humean-core/src"]
