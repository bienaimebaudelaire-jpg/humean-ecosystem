name: Public Repo Watch

on:
  schedule:
    - cron: "0 8 1,16 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run watcher and update issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/repo_watch.py \
            --publish-issue \
            --output /tmp/humean-repo-watch-report.md

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: humean-repo-watch-report
          path: /tmp/humean-repo-watch-report.md
